<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Gashtvan.svg" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Gashtvan — premium travel & tourism in Erbil, Kurdistan Region. Elevating travel experiences beyond boundaries."
    />
    <title>Gashtvan | Elevating Travel Experiences Beyond Boundaries</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('gashtvan-lang')
          var lang = stored === 'ar' || stored === 'ckb' || stored === 'en' ? stored : 'en'
          document.documentElement.lang = lang
          document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl'
        } catch (e) {}
      })()
    </script>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('gashtvan-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
